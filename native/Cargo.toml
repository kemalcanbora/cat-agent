[package]
name = "cat-agent-native"
version = "0.11.1"
edition = "2024"
description = "Native RAG indexing and PDF text extraction for Cat-Agent"
license = "Apache-2.0"
repository = "https://github.com/kemalcanbora/cat-agent"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
jieba-rs = "0.6.6"
lopdf = "0.38.0"
once_cell = "1.21"
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
regex = "1.12"
rustc-hash = "1.1"
rust-stemmers = "1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
tiktoken-rs = "0.7"
unicode-normalization = "0.1"
usearch = "2.15"
