[package]
name = "cat-agent-native"
version = "0.2.0"
edition = "2024"
description = "Native RAG indexing and PDF text extraction for Cat-Agent"
license = "Apache-2.0"
repository = "https://github.com/kemalcanbora/cat-agent"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
lopdf = "0.38.0"
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
