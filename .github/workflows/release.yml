name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-source:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path native/Cargo.toml

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: dist/*

  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: manylinux-x86_64
          - os: ubuntu-24.04-arm
            label: manylinux-aarch64
          - os: macos-latest
            label: macosx-arm64
          - os: windows-latest
            label: win-amd64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build native wheel (${{ matrix.label }})
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path native/Cargo.toml

      - name: Upload native wheel
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.label }}
          path: dist/*

  release:
    needs: [build-source, build-native]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-dist'
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: 'native-*'
          path: dist
          merge-multiple: true

      - name: Audit platform wheels
        run: chmod +x scripts/audit_release_wheels.sh && ./scripts/audit_release_wheels.sh

      - name: Install upload tools
        run: python -m pip install --upgrade twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          generate_release_notes: true
