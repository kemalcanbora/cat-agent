name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check formatting
        run: cargo fmt --manifest-path native/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets --no-default-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path native/Cargo.toml --no-default-features

  consumer-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install from built wheel like an end user
        run: ./scripts/install_consumer.sh 'rag,test'

      - name: Run Python/Rust parity tests
        run: pytest tests/test_native_rag.py tests/test_keyword_search.py

      - name: Smoke test Rust keyword-search example
        run: python examples/rag_keyword/rust_keyword_search_demo.py

      - name: Smoke test native vector-search example
        run: python examples/rag_vector/native_vector_search_demo.py

      - name: Smoke test native RAG pipeline example
        run: python examples/rag_native/native_rag_pipeline_demo.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build native wheel
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --out dist --manifest-path native/Cargo.toml
          ls -la dist/

      - name: Install wheel with test extras
        run: |
          WHEEL="$(ls -1 dist/*.whl | head -1)"
          if [[ -z "${WHEEL}" || ! -f "${WHEEL}" ]]; then
            echo "Error: no wheel found under dist/" >&2
            exit 1
          fi
          python -m pip install --force-reinstall "${WHEEL}[test,rag,mcp,python_executor,code_interpreter,transformers,llama,wasm]"
          ./scripts/sync_native_from_wheel.sh "${WHEEL}"

      - name: Run linting (optional)
        run: |
          pip install ruff
          ruff check .
        continue-on-error: true

      - name: Run tests with coverage
        # Use path form (--cov=./cat_agent), not the module name: coverage's
        # module-source probe double-imports PyO3 extensions and fails with
        # "cannot load module more than once per process".
        run: pytest --cov=./cat_agent --cov-report=term-missing --cov-fail-under=50
