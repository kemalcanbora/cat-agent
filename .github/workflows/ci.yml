name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check formatting
        run: cargo fmt --manifest-path native/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets --no-default-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path native/Cargo.toml --no-default-features

  consumer-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install from built wheel like an end user
        run: ./scripts/install_consumer.sh 'rag,test'

      - name: Run Python/Rust parity tests
        run: pytest tests/test_native_rag.py tests/test_keyword_search.py

      - name: Smoke test Rust keyword-search example
        run: python examples/rag_keyword/rust_keyword_search_demo.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build native wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path native/Cargo.toml

      - name: Install wheel with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall "dist/"*.whl[test,rag,mcp,python_executor,code_interpreter]
          ./scripts/sync_native_from_wheel.sh

      - name: Run linting (optional)
        run: |
          pip install ruff
          ruff check .
        continue-on-error: true

      - name: Run tests with coverage
        run: pytest --cov=cat_agent --cov-report=term-missing --cov-fail-under=50
