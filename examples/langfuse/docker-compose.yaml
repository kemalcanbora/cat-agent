services:
  keygen:
    image: docker.io/alpine:3
    command: >
      sh -c "test -f /secrets/encryption_key ||
             (apk add --no-cache openssl >/dev/null &&
              openssl rand -hex 32 | tr -d '\n' > /secrets/encryption_key)"
    volumes:
      - langfuse_secrets:/secrets

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    restart: always
    entrypoint: ["sh", "-c", "export ENCRYPTION_KEY=$$(cat /secrets/encryption_key) && exec dumb-init -- node ./worker/dist/index.js"]
    depends_on: &langfuse-depends-on
      keygen:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - langfuse_secrets:/secrets:ro
    environment: &langfuse-worker-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      SALT: mysalt
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: myredissecret

  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    restart: always
    entrypoint: ["sh", "-c", "export ENCRYPTION_KEY=$$(cat /secrets/encryption_key) && exec dumb-init -- ./web/entrypoint.sh node ./web/server.js --keepAliveTimeout 110000"]
    depends_on: *langfuse-depends-on
    ports:
      - 3000:3000
    volumes:
      - langfuse_secrets:/secrets:ro
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: mysecret
      LANGFUSE_INIT_ORG_ID: cat-agent-org
      LANGFUSE_INIT_ORG_NAME: Cat Agent
      LANGFUSE_INIT_PROJECT_ID: cat-agent-project
      LANGFUSE_INIT_PROJECT_NAME: cat-agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-cat-agent-demo
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-cat-agent-demo
      LANGFUSE_INIT_USER_EMAIL: demo@example.com
      LANGFUSE_INIT_USER_NAME: Demo1
      LANGFUSE_INIT_USER_PASSWORD: password1

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7
    restart: always
    command: --requirepass myredissecret --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: docker.io/postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_minio_data:
  langfuse_redis_data:
  langfuse_secrets: