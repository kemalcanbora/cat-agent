apiVersion: v1
name: calculator
team: demo
runtime:
  entrypoint: serve_math_guy:registry
  python: "3.11"
trigger:
  type: http
  jobs: inline
model:
  alias: minimax-m3
resources:
  cpu: 500
  memory: 512
  timeout: 300s
scaling:
  min: 1
  max: 1
serve:
  max_concurrency: 4
  max_queue: 4
  shutdown_timeout: 30s
tools:
  allow: []
env:
  LOG_LEVEL: INFO
