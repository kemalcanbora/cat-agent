[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "cat-agent"
dynamic = ["version", "readme"]
description = "Cat-Agent: Enhancing LLMs with Agent Workflows, RAG, Function Calling, and Code Interpreter."
authors = [
    { name = "Kemalcan Bora", email = "kemalcanbora@gmail.com" },
]
license = { text = "Apache-2.0" }
keywords = ["LLM", "Agent", "Function Calling", "RAG", "Code Interpreter"]
requires-python = ">=3.10"
dependencies = [
    "eval_type_backport",
    "json5",
    "jsonlines",
    "jsonschema",
    "openai",
    "pydantic>=2.3.0",
    "pydantic-core==2.23.4",
    "requests",
    "tiktoken",
    "pillow",
    "dotenv",
    "llama-cpp-python>=0.3.16",
    "mlx-lm==0.31.1",
    "wasmtime==41.0.0",
    "loguru==0.7.3"
]

[project.optional-dependencies]
rag = [
    "charset-normalizer",
    "jieba",
    "snowballstemmer",
    "beautifulsoup4",
    "pdfminer.six",
    "pdfplumber",
    "python-docx",
    "python-pptx",
    "polars",
    "xlsx2csv",
    "fastexcel",
    "pyarrow==17.0.0",
    "tabulate",
]
mcp = ["mcp"]
otel = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]
python_executor = [
    "pebble",
    "multiprocess",
    "timeout_decorator",
    "python-dateutil",
    "sympy",
    "numpy",
    "scipy",
]
code_interpreter = [
    "anyio>=3.7.1",
    "fastapi>=0.103.1",
    "jupyter>=1.0.0",
    "uvicorn>=0.23.2",
]
test = [
    "pytest",
    "pytest-cov",
    "rank_bm25",
]
all = [
    "cat-agent[rag,mcp,otel,python_executor,code_interpreter]",
]

[project.urls]
Homepage = "https://github.com/kemalcanbora/cat-agent"
"Issue Tracker" = "https://github.com/kemalcanbora/cat-agent/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["benchmarks", "benchmarks.*", "examples", "examples.*", "native", "native.*", "tests", "tests.*"]

[tool.setuptools.dynamic]
version = { attr = "cat_agent.__version__" }
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools.package-data]
"cat_agent" = [
    "utils/qwen.tiktoken",
    "tools/resource/*.ttf",
    "tools/resource/*.py",
    "tools/resource/docker_runtime/*.py",
    "tools/resource/docker_runtime/*.dockerfile",
    "tools/resource/wasm_runtime/bin/python-3.11.1.wasm",
    "tools/resource/wasm_runtime/usr/local/lib/python311.zip",
]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "."
module-name = "cat_agent._native"
bindings = "pyo3"
strip = true

