[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "cat-agent"
dynamic = ["version", "readme"]
description = "On-premise, sandboxed AI agent platform for regulated sectors."
authors = [
    { name = "Kemalcan Bora", email = "kemalcanbora@gmail.com" },
]
license = { text = "Apache-2.0" }
keywords = ["LLM", "Agent", "Function Calling", "RAG", "Code Interpreter"]
requires-python = ">=3.10"
dependencies = [
    "eval_type_backport",
    "docstring_parser>=0.16",
    "json5",
    "jsonlines",
    "jsonschema",
    "openai",
    "pydantic>=2.3.0",
    "requests",
    "tiktoken",
    "pillow",
    "python-dotenv",
    "loguru==0.7.3",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
transformers = [
    "transformers>=4.51.0",
    "torch>=2.0",
    "accelerate>=1.4.0",
    "pyopenssl>=26.0.0",
]
llama = [
    "llama-cpp-python>=0.3.16",
]
wasm = [
    "wasmtime==41.0.0",
]
wasm-bundled = [
    "wasmtime==41.0.0",
]
local = [
    "cat-agent[transformers,llama,wasm]",
]
mlx = [
    "mlx-lm==0.31.1",
]
rag = [
    "charset-normalizer",
    "beautifulsoup4",
    "python-docx",
    "python-pptx",
    "polars",
    "xlsx2csv",
    "fastexcel",
    "pyarrow==17.0.0",
    "tabulate",
    "onnxruntime>=1.17.0",
]
mcp = [
    "mcp>=1.2.0,<2.0.0",
]
otel = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]
python_executor = [
    "pebble",
    "multiprocess",
    "timeout_decorator",
    "python-dateutil",
    "sympy",
    "numpy",
    "scipy",
]
code_interpreter = [
    "anyio>=3.7.1",
    "fastapi>=0.103.1",
    "jupyter>=1.0.0",
    "uvicorn>=0.23.2",
]
pii = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "rank_bm25",
]
all = [
    "cat-agent[rag,mcp,otel,python_executor,code_interpreter,transformers,llama,wasm-bundled,mlx]",
]

[project.scripts]
cat-agent = "cat_agent.cli:main"

[project.urls]
Homepage = "https://github.com/kemalcanbora/cat-agent"
"Issue Tracker" = "https://github.com/kemalcanbora/cat-agent/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["benchmarks", "benchmarks.*", "examples", "examples.*", "native", "native.*", "tests", "tests.*"]

[tool.setuptools.dynamic]
version = { attr = "cat_agent.__version__" }
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools.package-data]
"cat_agent" = [
    "utils/qwen.tiktoken",
    "tools/resource/*.ttf",
    "tools/resource/*.py",
    "tools/resource/docker_runtime/*.py",
    "tools/resource/docker_runtime/*.dockerfile",
    "tools/resource/wasm_runtime/bin/python-3.11.1.wasm",
    "tools/resource/wasm_runtime/usr/local/lib/python311.zip",
]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "."
module-name = "cat_agent._native"
bindings = "pyo3"
strip = true
